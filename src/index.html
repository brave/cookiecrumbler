<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>cookiecrumbler</title>
    <style>
* {
  font-family: sans-serif;
}
html {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
body {
  background: #eee;
  font-size: 1.25em;
  margin: 2em;
  flex: 1;
  display: flex;
  flex-direction: column;
}
h1 {
  font-family: Poppins, fantasy;
  margin: unset;
}
footer a[href] {
  color: #8ad;
  text-decoration: none;
}
pre,code {
  font-family: monospace;
  background: #eee;
  border-radius: 0.2em;
  padding: 0.5em;
}
code {
  padding: 0.2em 0.5em;
}
#controls {
  display: flex;
  flex-direction: column;
  gap: 1em;
}
#dev_menu {
  display: none;
}
.dev-mode #dev_menu {
  display: block;
}
.row {
  display: flex;
  flex-direction: row;
}
fieldset {
  border: 2px solid #ddd;
  border-radius: 0.2em;
  color: #888;
}
input[type="url"],button {
  font-size: 1.5em;
  height: 50px;
  border: none;
  border-radius: 0.2em;
  padding: 0 0.75em;
  flex: 1;
}
button {
  background: #bdf;
  margin-left: 0.25em;
  transition: background 1s, box-shadow 0.2s;
  cursor: pointer;
  min-width: 15em;
  flex: 0;
}
button:hover {
  background: linear-gradient(to right, #dbf, #ffb);
  box-shadow: 0 0 1em #fff;
}
input[type="url"] {
  font-family: monospace;
  width: 40em;
}
select {
  font-family: monospace; /* Sets the font to monospace */
  width: 30em;            /* Sets the width of the select element */
  padding: 0.5em;         /* Adds some padding for better appearance */
  border: 1px solid #ccc; /* Adds a border similar to input fields */
  border-radius: 4px;     /* Rounds the corners of the select box */
  background-color: #fff; /* Sets the background color */
  color: #333;            /* Sets the text color */
}
select option {
  font-family: monospace; /* Ensures the option text uses the same font */
  color: #333;            /* Sets the text color for options */
  background-color: #fff; /* Sets the background color for options */
}
img {
  box-shadow: 0 0 0.5em #ccc;
}
img:hover {
  box-shadow: 0 0 1em #888;
}

#reportlist {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2em;
  margin: 2em 0;
}
.report-card {
  background: white;
  padding: 1em 2.5em 2.5em 2.5em;
  border-radius: 0.25em;
  box-shadow: 0 0 0.1em #ccc;
}
.datestring {
  font-style: italic;
  color: #888;
}
#spinner {
  font-size: 3em;
  display: none;
  width: 3em;
  height: 3em;
  margin: auto;
  text-align: center;
  line-height: 3em;
}
#spinner.active {
  display: block;
  animation: spin 1s linear infinite;
}
#progress {
  display: none;
  margin: 1.5em 0;
  max-width: min(60em, 100%);
}
#progress.active {
  display: block;
}
#progress-track {
  max-width: 40em;
  height: 0.6em;
  background: #ddd;
  border-radius: 0.3em;
  overflow: hidden;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: #bdf;
  border-radius: 0.3em;
  transition: width 0.4s;
}
#progress-label {
  font-size: 0.75em;
  color: #666;
  margin-top: 0.3em;
}
#progress-frame {
  /* natural resolution up to the container: no upscale blur on small
     viewports, and large-viewport checks use the space a wide screen offers */
  max-width: 100%;
  height: auto;
  margin-top: 0.75em;
  border-radius: 0.3em;
  box-shadow: 0 0 0 1px #ddd;
}
@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}
details pre {
  white-space: pre-wrap;
}
#devices-select {
  width: 15em; /* Shortens the width of the devices-select dropdown */
}

#version {
  color: #888;
  margin-left: 1em;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

#toast-message {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  display: none;
  z-index: 1000;
}
#toast-message.shown {
  display: block;
}

.warning-icon {
  background: hsl(45deg 100% 85%);
  color: hsl(45deg 100% 20%);
  padding: 0.25em 1em;
  margin-left: 0.5em;
  border-radius: 1em;
  cursor: help;
}

#locations {
  display: none;
}
#locations:has(option:not([value=""])) {
  display: block;
}

.wpr-link {
  font-size: 0.5em;
}
.wpr-link a {
  color: #8ad;
}

.filter-input {
  width: 100%;
  margin-bottom: 0.5em;
  padding: 0.5em;
  box-sizing: border-box;
  font-family: monospace;
}

.copy-rules-button {
  font-size: 0.8em;
  padding: 0.5em 1em;
  margin-bottom: 0.5em;
}
    </style>
  </head>
  <body>
    <h1>cookiecrumbler</h1>
    <p>Enter a URL to scan it for cookie notices.</p>
    <form id="controls">
      <div class="row">
        <input type="url" id="url-input" name="url-input" placeholder="https://example.com" autofocus required/>
        <button type="submit" id="execute">Check for cookie notices ↪</button>
      </div>
      <div class="row">
      <fieldset id="adblock-lists">
        <legend>
          <input type="checkbox" id="toggle-all-lists" checked>
          <label for="toggle-all-lists">Enabled lists</label>
        </legend>
      </fieldset>

      <fieldset id="locations">
        <legend>Choose a location:</legend>
        <select id="locations-select" name="locations">
          <option value="">direct</option>
        </select>
      </fieldset>

      <fieldset id="other">
        <legend>Other options:</legend>
        <label><input type="checkbox" id="full_page_screenshot" name="full_page_screenshot">Full page screenshot</label>
        <br>
        <label><input type="checkbox" id="slow_check" name="slow_check">Thorough check (slow)</label>
        <br>
        <label>Device:</label>
        <select id="devices-select" name="devices">
          <option value="">default</option>
        </select>
        <br>
        <label>Viewport:</label>
        <select id="viewport-select" name="viewport">
          <option value="">default</option>
        </select>
        <div id="device-viewport-warning" style="display: none; color: #d32f2f; margin-top: 0.5em; font-size: 0.9em;">
          ⚠️ Cannot specify both device and viewport
        </div>
      </fieldset>

      <fieldset id="dev_menu">
        <legend>Dev menu</legend>
        <label><input type="checkbox" id="wpr-record" name="wpr-record">Record with WprGo (WebPageReplay)<span id="wpr-record-warning" class="warning-icon" hidden title="Enabled adblock lists can apply network filters that prevent some assets from being fetched. The recording will be missing those assets, which may affect regression tests.">!</span></label>
        <br>
        <label>Replay archive:
          <input type="file" id="wpr-replay-file" name="wpr-replay-file" accept=".wprgo,application/gzip">
        </label>
        <br>
        <label>User Agent:
          <input type="text" id="user-agent-input" name="user-agent" placeholder="Custom user agent string" style="width: 25em; font-family: monospace;">
        </label>
        <br>
        <label>Disable features:</label>
        <fieldset id="disable-features-list">
          <legend>Chromium feature flags</legend>
        </fieldset>
        <br>
      </fieldset>
      </div>
    </form>
    <div id="spinner">🍪</div>
    <div id="progress">
      <div id="progress-track"><div id="progress-bar"></div></div>
      <div id="progress-label"></div>
      <img id="progress-frame" alt="Latest page render" hidden>
    </div>
    <div id="reportlist"></div>
    <footer>
      <a href="https://github.com/brave/cookiecrumbler">Source code</a>
      <span id="version"></span>
      <div id="toast-message"></div>
    </footer>
    <script type="module">
      // Setup cookiecrumbler version
      {
        const versionSpan = document.getElementById('version');

        fetch('/version')
          .then(response => response.text())
          .then(version => versionSpan.innerText = version)
          .catch(e => {
            console.log(e)
            versionSpan.innerText = '(ERR)'
          })

        const toast = document.getElementById('toast-message');
        const devMenu = document.getElementById('dev_menu');

        if (localStorage.getItem('devModeEnabled') !== null) {
          document.body.classList.add('dev-mode')
        }

        function showToast(message, duration = 2000) {
          toast.textContent = message;
          toast.classList.add('shown');
          setTimeout(() => {
            toast.classList.remove('shown');
          }, duration);
        }

        versionSpan.addEventListener('click', (e) => {
          if (localStorage.getItem('devModeEnabled') === null) {
            localStorage.setItem('devModeEnabled', 'true');
            document.body.classList.add('dev-mode')
            showToast('Dev mode enabled', 3000);
          } else {
            localStorage.removeItem('devModeEnabled')
            document.body.classList.remove('dev-mode')
            showToast('Dev mode disabled', 3000);
          }
        });
      }

      function toggleAllLists(checked) {
          const checkboxes = document.querySelectorAll('#adblock-lists input[type="checkbox"]:not(#toggle-all-lists)');
          checkboxes.forEach(checkbox => {
            checkbox.checked = checked;
          });
      }
      document.getElementById('toggle-all-lists').onchange = function() { toggleAllLists(this.checked); };
      document.addEventListener("DOMContentLoaded", async function() {
        // Fetch additional capabilities from the server and populate the UI accordingly
        const configEndpoints = {
          adblock_lists: adblock_lists => {
            const fieldset = document.getElementById('adblock-lists');
            for (const [uuid, name] of Object.entries(adblock_lists)) {
              const checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              checkbox.id = uuid;
              checkbox.name = name;
              checkbox.checked = true;

              const label = document.createElement('label');
              label.htmlFor = uuid;
              label.textContent = name;

              fieldset.appendChild(checkbox);
              fieldset.appendChild(label);
              fieldset.appendChild(document.createElement('br'));
            }
          },
          proxy_list: proxy_list => {
            const locationsSelectElement = document.getElementById('locations-select');
            for (const continent in proxy_list) {
              const continentGroup = document.createElement("optgroup");
              continentGroup.label = continent;
              for (const country in proxy_list[continent]) {
                const countryPrefix = `${country} - `;
                for (const city in proxy_list[continent][country]) {
                  const option = document.createElement("option");
                  option.value = proxy_list[continent][country][city];
                  option.textContent = `${countryPrefix}${city}`;
                  continentGroup.appendChild(option);
                }
              }
              locationsSelectElement.appendChild(continentGroup);
            }
          },
          options: options => {
            // Populate devices
            const devicesSelectElement = document.getElementById('devices-select');
            options.devices.forEach(deviceName => {
              const option = document.createElement("option");
              option.value = deviceName;
              option.textContent = deviceName;
              devicesSelectElement.appendChild(option);
            });

            const viewportSelectElement = document.getElementById('viewport-select');
            options.viewports.forEach(viewportName => {
              const option = document.createElement("option");
              option.value = viewportName;
              option.textContent = viewportName;
              viewportSelectElement.appendChild(option);
            });

            const disableFeaturesFieldset = document.getElementById('disable-features-list');
            (options.disableFeatures || []).forEach(featureName => {
              const checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              checkbox.id = `disable-feature-${featureName}`;
              checkbox.name = 'disable-features';
              checkbox.value = featureName;

              const label = document.createElement('label');
              label.htmlFor = checkbox.id;
              label.textContent = featureName;

              disableFeaturesFieldset.appendChild(checkbox);
              disableFeaturesFieldset.appendChild(label);
              disableFeaturesFieldset.appendChild(document.createElement('br'));
            });

            // Setup device/viewport mutual exclusion warning
            const warningElement = document.getElementById('device-viewport-warning');
            const checkConflict = () => {
              const deviceValue = devicesSelectElement.value;
              const viewportValue = viewportSelectElement.value;
              if (deviceValue && viewportValue) {
                warningElement.style.display = 'block';
              } else {
                warningElement.style.display = 'none';
              }
            };
            devicesSelectElement.addEventListener('change', checkConflict);
            viewportSelectElement.addEventListener('change', checkConflict);
          },
        };
        Object.keys(configEndpoints).forEach(endpoint => {
          const configRoutine = configEndpoints[endpoint];
          fetch('/' + endpoint + '.json')
            .then(response => response.json())
            .then(configRoutine);
        });
      });
      const urlInput = document.getElementById('url-input');
      const locationSelector = document.getElementById('locations-select');
      const executeButton = document.getElementById('execute');
      const spinner = document.getElementById('spinner');
      const reportList = document.getElementById('reportlist');
      const form = document.getElementById('controls');
      const wprRecordCheckbox = document.getElementById('wpr-record');
      const wprReplayFileInput = document.getElementById('wpr-replay-file');

      // Record and replay are mutually exclusive; replay makes the URL optional
      wprReplayFileInput.addEventListener('change', () => {
        const hasFile = wprReplayFileInput.files.length > 0;
        if (hasFile) {
          wprRecordCheckbox.checked = false;
        }
        urlInput.required = !hasFile;
        updateWprRecordWarning();
      });
      wprRecordCheckbox.addEventListener('change', () => {
        if (wprRecordCheckbox.checked) {
          wprReplayFileInput.value = '';
          urlInput.required = true;
        }
        updateWprRecordWarning();
      });
      // Warn when recording while adblock lists are enabled: their network
      // filters may prevent assets from being fetched, affecting the recording
      const wprRecordWarning = document.getElementById('wpr-record-warning');
      const updateWprRecordWarning = () => {
        const anyListEnabled = Array.from(
          document.querySelectorAll('#adblock-lists input[type="checkbox"]:not(#toggle-all-lists)')
        ).some(checkbox => checkbox.checked);
        wprRecordWarning.hidden = !(wprRecordCheckbox.checked && anyListEnabled);
      };
      document.getElementById('adblock-lists').addEventListener('change', updateWprRecordWarning);

      /**
       * Reads a WprGo archive file and returns the wprGo request payload,
       * or null (after alerting) if the file fails the basic integrity check.
       */
      async function wprGoPayloadForReplayFile(file) {
        const buf = new Uint8Array(await file.arrayBuffer());
        // WprGo archives are gzipped; check the gzip magic bytes (0x1f 0x8b)
        if (buf.length < 2 || buf[0] !== 0x1f || buf[1] !== 0x8b) {
          alert('The selected file does not look like a WprGo archive (expected gzip).');
          return null;
        }
        let binary = '';
        const CHUNK = 0x8000;
        for (let i = 0; i < buf.length; i += CHUNK) {
          binary += String.fromCharCode.apply(null, buf.subarray(i, i + CHUNK));
        }
        return { action: 'replay', data: btoa(binary) };
      }

      // BEGIN SSE stream parser (sliced out verbatim by test/streamParser.test.mjs)

      /**
       * Incremental parser for an SSE stream over a fetch body. Event blocks
       * (up to their \n\n terminator) accumulate as chunk arrays and are
       * joined once, so a multi-megabyte event (the base64 report) costs one
       * linear pass instead of quadratic recopying. Yields raw blocks,
       * including `:` comment blocks (heartbeats).
       */
      async function* sseBlocks (bodyStream) {
        const reader = bodyStream.getReader()
        const decoder = new TextDecoder()
        let pending = []
        // at most one '\n' is carried between reads: a \n\n terminator can
        // only split across a chunk edge if the earlier chunk ends with '\n'
        let carry = ''
        let eof = false
        while (!eof) {
          const { value, done } = await reader.read()
          if (done) {
            eof = true
          }
          let text = carry + (value === undefined ? '' : decoder.decode(value, { stream: true }))
          if (eof) {
            text += decoder.decode()
          }
          carry = ''
          let start = 0
          while (true) {
            const end = text.indexOf('\n\n', start)
            if (end === -1) {
              break
            }
            pending.push(text.slice(start, end))
            const block = pending.join('')
            pending = []
            if (block.trim() !== '') {
              yield block
            }
            start = end + 2
          }
          const rest = text.slice(start)
          if (eof) {
            pending.push(rest)
            const block = pending.join('')
            if (block.trim() !== '') {
              yield block
            }
            return
          }
          if (rest.endsWith('\n')) {
            carry = '\n'
            pending.push(rest.slice(0, -1))
          } else {
            pending.push(rest)
          }
        }
      }

      /**
       * Parses one SSE block into { event, data }: `event:` selects the named
       * event (default "message"), `data:` lines join with \n, and `:` comment
       * lines (heartbeats) are ignored.
       */
      const parseSseBlock = (block) => {
        let event = 'message'
        const data = []
        for (const line of block.split('\n')) {
          if (line === '' || line.startsWith(':')) {
            continue
          }
          const separator = line.indexOf(':')
          if (separator === -1) {
            continue
          }
          const field = line.slice(0, separator)
          let value = line.slice(separator + 1)
          if (value.startsWith(' ')) {
            value = value.slice(1)
          }
          if (field === 'event') {
            event = value
          } else if (field === 'data') {
            data.push(value)
          }
        }
        return { event, data: data.join('\n') }
      }
      // END SSE stream parser

      const PROGRESS_WEIGHTS = {
        queued: 3,
        'preparing-profile': 6,
        'starting-proxy': 10,
        'starting-wpr': 10,
        'launching-browser': 18,
        'browser-launched': 22,
        navigating: 28,
        'page-loaded': 48,
        'settling-network': 58,
        'network-settled': 63,
        'waiting-settle': 70,
        classifying: 85,
        'capturing-artifacts': 95,
        'archiving-wpr': 97,
        'closing-browser': 99
      }
      const progressArea = document.getElementById('progress')
      const progressBar = document.getElementById('progress-bar')
      const progressLabel = document.getElementById('progress-label')
      const progressFrame = document.getElementById('progress-frame')
      let progressPercent = 0

      const resetProgress = () => {
        progressPercent = 0
        progressBar.style.width = '0%'
        progressLabel.textContent = ''
        progressFrame.hidden = true
        progressFrame.src = ''
      }
      const showProgress = (phase) => {
        const weight = PROGRESS_WEIGHTS[phase]
        if (weight !== undefined && weight > progressPercent) {
          progressPercent = weight
          progressBar.style.width = `${weight}%`
        }
        progressLabel.textContent = phase.replaceAll('-', ' ')
      }

      // timestamps make event pacing comparable against the server-reported
      // t offsets in progress payloads
      const streamLog = (message, ...args) => console.log(`[stream ${new Date().toISOString()}] ${message}`, ...args)
      const streamDebug = (message, ...args) => console.debug(`[stream ${new Date().toISOString()}] ${message}`, ...args)
      const streamWarn = (message, ...args) => console.warn(`[stream ${new Date().toISOString()}] ${message}`, ...args)

      /**
       * Consumes the streamed SSE check response and resolves to the final
       * report. Interim screenshots arrive as base64 data URLs and replace
       * the thumbnail image; the final report is byte-identical to the
       * buffered JSON response, so its screenshot renders through the
       * legacy path.
       */
      async function consumeStreamedReport (resp, requestUrl) {
        const contentType = resp.headers.get('content-type') ?? ''
        if (!contentType.includes('text/event-stream')) {
          throw new Error(`unexpected check response content-type: ${contentType}`)
        }
        streamLog('response', {
          status: resp.status,
          contentType,
          contentEncoding: resp.headers.get('content-encoding')
        })
        let report = null
        let eventIndex = 0
        for await (const block of sseBlocks(resp.body)) {
          const { event, data } = parseSseBlock(block)
          if (data === '') {
            streamDebug(`event ${eventIndex}: ${event} (no data)`)
            continue
          }
          const payload = JSON.parse(data)
          streamLog(`event ${eventIndex}: ${event}`, payload)
          if (event === 'progress') {
            showProgress(payload.phase)
          } else if (event === 'screenshot') {
            // data URLs need no object-URL bookkeeping
            progressFrame.src = `data:image/webp;base64,${payload.data}`
            progressFrame.hidden = false
          } else if (event === 'error') {
            report = { error: payload.error, url: requestUrl, timestamp: Date.now() }
          } else if (event === 'report') {
            report = payload
          }
          eventIndex += 1
        }
        streamLog(`stream ended after ${eventIndex} events; report=${report !== null ? 'received' : 'MISSING'}`)
        if (report === null) {
          throw new Error('stream ended without a report event')
        }
        return report
      }

      function createReportCard(report) {
        const card = document.createElement('div');
        card.classList.add('report-card');
        card.setAttribute('data-report', JSON.stringify(report));

        const h2 = document.createElement('h2');
        h2.textContent = 'Report for ';
        const code = document.createElement('code');
        code.textContent = report.url;
        h2.appendChild(code);
        
        if (report.wpr) {
          // report.wpr is base64-encoded; decode it into a Blob for the download link
          const binary = atob(report.wpr);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const blob = new Blob([bytes], { type: 'application/octet-stream' });
          const url = window.URL.createObjectURL(blob);
          const date = new Date(report.timestamp);
          const dateStr = date.toISOString().slice(0,10);
          const timeStr = date.toTimeString().slice(0,8);

          const wprLink = document.createElement('a');
          wprLink.textContent = '[wpr]';
          wprLink.href = url;
          wprLink.download = `${new URL(report.url).hostname}_${dateStr}_${timeStr}.wprgo`;
          const wprSpan = document.createElement('span');
          wprSpan.appendChild(wprLink);
          wprSpan.classList.add('wpr-link');
          h2.appendChild(wprSpan);
        }

        card.appendChild(h2);

        if (report.url !== report.originalUrl) {
          const h3 = document.createElement('h3');
          h3.textContent = 'redirected from ';
          const code = document.createElement('code');
          code.textContent = report.originalUrl;
          h3.appendChild(code);
          card.appendChild(h3);
        }

        const datestring = document.createElement('p');
        datestring.classList.add('datestring');
        datestring.textContent = new Date(report.timestamp).toString();
        card.appendChild(datestring);

        if (report.error !== undefined) {
          const p = document.createElement('p');
          p.textContent = 'An error occurred:';
          card.appendChild(p);
          const pre = document.createElement('pre');
          pre.textContent = report.error;
          card.appendChild(pre);
          return card;
        }

        const appendClassifierWarning = (p, report) => {
          if (report.classifiersUsed.includes('keyword')) {
            const span = document.createElement('span');
            span.textContent = '!';
            span.classList.add('warning-icon')
            span.title = 'Fallback classifier used. Result may be inaccurate.';
            p.appendChild(span);
          }
        }

        if (report.identified !== true) {
          const p = document.createElement('p');
          p.textContent = 'No cookie consent notices were identified.';
          appendClassifierWarning(p, report)
          card.appendChild(p);
        } else {
          const p = document.createElement('p');
          p.textContent = 'A cookie consent notice was identified.';
          appendClassifierWarning(p, report)
          card.appendChild(p);

          if (report.hideableIds !== undefined && report.hideableIds.length > 0) {
            const idList = document.createElement('pre');
            idList.textContent = report.hideableIds.map(id => `#${id}`).join('\n');
            card.appendChild(idList);
          }

          if (report.markup !== undefined) {
            const details = document.createElement('details');

            const summary = document.createElement('summary');
            summary.textContent = 'Inspect';
            details.appendChild(summary);

            const markup = document.createElement('pre');
            markup.textContent = report.markup;
            details.appendChild(markup);

            card.appendChild(details);
          }
        }

        if (report.scrollBlocked === true) {
          const p = document.createElement('p');
          p.textContent = '⚠️ Scrolling may be prevented on this page.';
          card.appendChild(p);
        }

        if (report.problematicOverlay === true) {
          const p = document.createElement('p');
          p.textContent = '⚠️ A "problematic overlay" was detected on this page.';
          card.appendChild(p);
        }

        if (report.unsupportedBrowser === true) {
          const p = document.createElement('p');
          p.textContent = '🚫 An "unsupported browser" message was detected on this page.';
          card.appendChild(p);
        }

        if (report.screenshot !== undefined) {
          const img = document.createElement('img');
          img.src = 'data:image/' + (report.screenshotType || 'webp') + ';base64,' + report.screenshot;
          img.onload = function() {
              // if the screenshot is large, display it in a details element
              // TODO: adjust size based on user screen size?
              if (this.width > 800 || this.height > 600) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.textContent = 'Screenshot';
                details.appendChild(summary);
                details.appendChild(img);
                card.appendChild(details);
              } else {
                const h3 = document.createElement('h3');
                h3.textContent = 'Screenshot';
                card.appendChild(h3);
                card.appendChild(img);
              }
          };
        }

        if (report.scriptSources && report.scriptSources.length > 0) {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = `Script sources (${report.scriptSources.length})`;
          details.appendChild(summary);
          const matchesPre = document.createElement('pre');

          // Add filter input box
          const filterInput = document.createElement('input');
          filterInput.type = 'text';
          filterInput.placeholder = 'Filter domains with regex...';
          filterInput.classList.add('filter-input')

          const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

          // Function to update the pre content based on filter
          const updateContent = (filterValue) => {
            try {
              const regex = filterValue ? new RegExp(filterValue) : null;
              const filteredSources = report.scriptSources.filter(domain =>
                !regex || regex.test(domain)
              );
              const adblockRules = [
                `! ${today} ${report.url}`,
                ...filteredSources.map(domain => `||${domain}^`)
              ].join('\n');
              matchesPre.textContent = adblockRules;
            } catch (e) {
              // Invalid regex - show all results
              const adblockRules = [
                `! ${today} ${report.url}`,
                ...report.scriptSources.map(domain => `||${domain}^`)
              ].join('\n');
              matchesPre.textContent = adblockRules;
            }
          };

          // Add filter input event listener
          filterInput.addEventListener('input', (e) => {
            updateContent(e.target.value);
          });

          details.appendChild(filterInput);

          // Add copy button
          const copyButton = document.createElement('button');
          copyButton.classList.add('copy-rules-button')
          copyButton.textContent = 'Copy rules';
          copyButton.onclick = () => {
            navigator.clipboard.writeText(matchesPre.textContent);
            const originalText = copyButton.textContent;
            copyButton.textContent = 'Copied!';
            setTimeout(() => {
              copyButton.textContent = originalText;
            }, 2000);
          };

          details.appendChild(copyButton);
          details.appendChild(matchesPre);

          // Initialize content
          updateContent('');

          card.appendChild(details);
        }

        return card;
      }

      form.onsubmit = async (e) => {
        e.preventDefault();

        // Validate device and viewport are not both selected
        const deviceValue = document.getElementById('devices-select').value;
        const viewportValue = document.getElementById('viewport-select').value;
        if (deviceValue && viewportValue) {
          alert('Cannot specify both device and viewport. Please select only one.');
          return;
        }

        // Build the WprGo payload: replay a selected archive, else record if checked
        const wprReplayFile = wprReplayFileInput.files[0];
        let wprGo;
        if (wprReplayFile) {
          wprGo = await wprGoPayloadForReplayFile(wprReplayFile);
          if (wprGo === null) {
            return;
          }
        } else if (wprRecordCheckbox.checked) {
          wprGo = { action: 'record' };
        }

        urlInput.disabled = true;
        locationSelector.disabled = true;
        executeButton.disabled = true;
        wprReplayFileInput.disabled = true;
        for (const checkbox of document.querySelectorAll('input[type="checkbox"]')) {
          checkbox.disabled = true;
        }
        spinner.classList.add('active');

        const url = document.getElementById('url-input').value;

        const fieldset = document.getElementById('adblock-lists');
        const checkboxes = fieldset.querySelectorAll('input[type="checkbox"]:not(#toggle-all-lists)');
        const adblockLists = Array.from(checkboxes).reduce((acc, checkbox) => {
                acc[checkbox.id] = checkbox.checked;
                return acc;
            }, {});
        const disableFeatures = Array.from(
          document.querySelectorAll('#disable-features-list input[type="checkbox"]:checked')
        ).map(checkbox => checkbox.value);
        const requestBody = JSON.stringify({
          url,
          adblockLists: adblockLists,
          location: locationSelector.value,
          screenshot: document.getElementById('full_page_screenshot').checked ? "fullPage" : true,
          slowCheck: document.getElementById('slow_check').checked,
          device: document.getElementById('devices-select').value,
          viewport: document.getElementById('viewport-select').value,
          userAgent: document.getElementById('user-agent-input')?.value,
          disableFeatures,
          wprGo
        })
        const newCard = await fetch('/check/stream', {
          method: 'POST',
          cache: 'no-cache',
          headers: { 'Content-Type': 'application/json' },
          body: requestBody,
        })
          .then(async resp => {
            const contentType = resp.headers.get('content-type') ?? '';
            streamLog('check response:', resp.status, contentType, 'encoding:', resp.headers.get('content-encoding'));
            if (!contentType.includes('text/event-stream') || !resp.body) {
              // only the stream endpoint is expected; anything else (old
              // server, proxy misroute) surfaces as an error card instead of
              // paying a second upload
              const text = await resp.text();
              try {
                return JSON.parse(text);
              } catch {
                // an error report instead of a thrown Error: Firefox and
                // Safari exclude the message from error.stack, so a thrown
                // status would never show in the card
                return {
                  error: `Check request failed with HTTP ${resp.status}${text ? `: ${text.slice(0, 500)}` : ''}`,
                  url,
                  timestamp: Date.now()
                };
              }
            }
            // streaming server: live progress and interim screenshots
            spinner.classList.remove('active');
            progressArea.classList.add('active');
            return consumeStreamedReport(resp, url);
          })
          .then(report => createReportCard(report, url))
          .catch(error => {
            // Firefox and Safari keep the message out of error.stack; build a
            // display string that always contains it
            const stack = error?.stack;
            const display = stack?.includes(String(error)) ? stack : [String(error), stack].filter(Boolean).join('\n');
            return createReportCard({ error: display, url, timestamp: new Date() });
          });

        if (reportList.children.length > 0) {
          reportList.insertBefore(newCard, reportList.children[0]);
        } else {
          reportList.appendChild(newCard);
        }

        urlInput.disabled = false;
        locationSelector.disabled = false;
        wprReplayFileInput.disabled = false;
        for (const checkbox of document.querySelectorAll('input[type="checkbox"]')) {
          checkbox.disabled = false;
        }
        executeButton.disabled = false;
        spinner.classList.remove('active');
        progressArea.classList.remove('active');
        resetProgress();
      };
    </script>
  </body>
</html>
